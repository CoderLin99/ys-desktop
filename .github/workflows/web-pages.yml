# 零成本 Web 静态站：构建 yi-desktop/dist 并发布到 GitHub Pages
name: Deploy Web

on:
  push:
    branches: [main, cursor/bazi-liuyao-calc-a334]
    paths:
      - 'yi-desktop/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yi-desktop/package-lock.json
      - name: Install & build
        run: |
          npm ci
          npm run build:vite
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yi-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
